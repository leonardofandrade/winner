# Desenvolvimento no Docker Desktop. Suba com deploy/dev.sh.
# Projeto Compose "winner-dev", separado do stack de produção.
name: winner-dev

services:
  db:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: winner
      MYSQL_USER: winner
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-winner}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  api:
    image: winner:dev
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    env_file: .env.dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_COLLECTSTATIC: "0"
    volumes:
      - .:/app
    ports:
      - "8081:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/contests/')"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 40s
    restart: unless-stopped

  bot:
    profiles: ["bot"]
    image: winner:dev
    build: .
    command: python manage.py run_telegram_bot
    env_file: .env.dev
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_COLLECTSTATIC: "0"
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  mysql_data:
